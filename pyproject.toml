[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python101"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.26.7",
]
[tool.uv]
package = true

[project.optional-dependencies]
build = [
    "setuptools",
]

[project.scripts]
learn = "python101.main:main"
